entity_graph:
  K_neighbors: 16
  build_entity_embeddings: true
  context_path: data/entities/entity_context.json
  degree_cap: 64
  entity_embeddings_path: data/entities/entity_embeddings.pt
  entity_faiss_index_path: data/entities/entity_faiss.index
  entity_graph_path: data/graph/entity_graph.pt
  entity_meta_path: data/entities/entity_meta.json
  entity_neighbors_mutual_path: data/entities/entity_neighbors_mutual.npy
  entity_neighbors_path: data/entities/entity_neighbors.npy
  entity_text_template: a photo of {}
  faiss_batch_size: 4096
  k_sem: 16
  max_samples: null
  min_df: 5
  normalize_embeddings: true
  verbose: true
  vocab_path: data/entities/entity_vocab.json
fusion:
  default_mode: full
  modes:
    clip_kg:
      w_clip: 0.7
      w_kg: 0.3
      w_blip2: 0.0  # BLIP-2 reranker weight
      w_stage2: 0.0  # Legacy alias for w_blip2
    clip_only:
      w_clip: 1.0
      w_kg: 0.0
      w_blip2: 0.0  # BLIP-2 reranker weight
      w_stage2: 0.0  # Legacy alias for w_blip2
    full:
      w_clip: 0.6
      w_kg: 0.2
      w_blip2: 0.2  # BLIP-2 reranker weight
      w_stage2: 0.2  # Legacy alias for w_blip2
    hybrid:
      w_clip: 0.7
      w_kg: 0.0
      w_blip2: 0.3  # BLIP-2 reranker weight
      w_stage2: 0.3  # Legacy alias for w_blip2
graph_search:
  B: 20
  H_max: 2
  K_seed: 10
  N_max: 200
  T_cap_ms: 150
  decay: 0.85
  # Edge family weights (3 families: sem, cooc_caption, cooc_vision)
  type_weight_sem: 1.0
  type_weight_cooc_caption: 0.7
  type_weight_cooc_vision: 0.7
  # Legacy unified weight (for backward compatibility)
  type_weight_cooc: 0.7
phase5:
  binding:
    clip_fallback:
      enable: true
      prompt_template: a photo of a {attr} {obj}
    enable: false
    hsv_ranges:
      blue:
        h_max: 130
        h_min: 100
        s_min: 50
        v_min: 50
      green:
        h_max: 80
        h_min: 50
        s_min: 40
        v_min: 40
      orange:
        h_max: 25
        h_min: 10
        s_min: 50
        v_min: 50
      red:
        h_max: 10
        h_min: 0
        s_min: 50
        v_min: 50
      yellow:
        h_max: 40
        h_min: 20
        s_min: 50
        v_min: 50
    topB_boxes: 5
    topN_images: 50
  candidates:
    C_max: 128
    tau_vis: 0.2
    visual_prior_topK: 50  # Day 5: renamed from vis_prior_topK for consistency
    # Global probes and stable priority union controls
    global_topN: 50
    # Priority order for candidate union (stable across runs)
    priority_order: ["caption", "visual_prior", "safe_neighbors", "global"]
    # Optional per-source caps (null = no cap)
    max_caption: null
    max_visual_prior: null
    max_safe_neighbors: null
    max_global: null
  detector:
    batch_size_images: 8
    batch_size_phrases: 128
    cache_dir: data/vision/cache
    model_id: owlvit
    # Split-safe shard directory templates (prevent train/val/test leakage)
    raw_shards_dir_template: "data/vision/{split}_raw_shards"
    post_shards_dir_template: "data/vision/{split}_post_shards"
    # Legacy (not split-safe); prefer *_dir_template for new code
    post_shards_dir: data/vision/post_shards
    raw_shards_dir: data/vision/raw_shards
    shard_size: 500
  negative_controls:
    delta: 0.05
    noise_percentile: 95
    null_phrases:
    - xyzzy nonsense phrase 1
    - blark random phrase 2
    - qwerty meaningless phrase 3
  pmi:
    degree_cap: 500
    npmi_min: 0.2
    npmi_min_stop: 0.2
    per_node_topk: 200
    smoothing_eps: 1.0
    stop_nodes_topM_df: 50
  safe_neighbors:
    enabled: true  # Day 5: enable safe neighbor expansion
    seed_sources: ["caption"]  # Day 5: default to caption only; can add "visual_prior"
    use_mutual_knn: true
    require_in_vis_prior: false  # Day 5: pixel anchoring (keep only neighbors also in visual prior)
    tau_sim: null  # Day 5: similarity threshold (null = disabled; requires precomputed sims if set)
    min_df_vis: 5  # Legacy: kept for backward compatibility
  thresholds:
    min_support: 200
    objective: fixed_fpr
    strategy: grouped
    target_fpr: 0.05  # Moved from artifacts (used by threshold fitting, not candidate gen)
    target_precision: 0.9  # Moved from artifacts
  # Day 5: Artifact paths for candidate generation
  artifacts:
    entity_faiss_index_path: data/entities/entity_faiss.index
    entity_neighbors_path: data/entities/entity_neighbors.npy
    entity_neighbors_mutual_path: data/entities/entity_neighbors_mutual.npy
    entity_global_list_path: null  # Optional cache; computed from context if absent
query_enrichment:
  K_seed_raw: 32
  M_enrich: 8
  enabled: true
  image_template: photo of {entities}
  log_examples: true
  text_template: '{query}. Related: {entities}'
  w_freq: 0.5
  w_sim: 0.5
